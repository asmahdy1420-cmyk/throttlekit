[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "throttlekit"
version = "0.1.0"
description = "Rate limiting for Python services: five algorithms, atomic Redis Lua backend, ASGI middleware."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Mahdy", email = "mahdy@progma.tech" }]
requires-python = ">=3.11"
keywords = ["rate-limit", "redis", "asgi", "fastapi", "starlette", "gcra", "token-bucket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "redis>=5.0",
    "fakeredis[lua]>=2.23",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "starlette>=0.37",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/throttlekit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "C4", "PT"]
# The code also runs on Python 3.9 for local testing, so keep runtime type
# aliases in typing.Optional / typing.Callable form and avoid 3.10+/3.11+ only
# APIs (zip(strict=...), enum.StrEnum).
ignore = ["UP007", "UP035", "UP042", "UP045", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["throttlekit"]
